# Settings for the handoff scripts (sourced). Every value can be overridden from the environment.
: "${PROJECT:=project-03050886-e5fd-4c6a-a2a}"
: "${ZONE:=us-central1-a}"
: "${BUCKET:=ramjet-i4-336381269092}"
: "${VM:=ramjet-i4-b}"
# Hand off only if these cloud cases (space separated) finished (rc 0) in the bucket, i.e. the VM is really free. Empty = no check.
: "${PREREQ_CASE:=flatplate/M6Tw076_L2}"
: "${HARD_STOP_H:=12}"
# Relative paths are relative to the repo.
: "${STATE:=cases/runs/handoff}"
: "${LOG:=cases/runs/handoff.log}"
# Recall the job from the cloud only if it saves more than this many seconds of local compute time.
: "${RECALL_GAIN_S:=1200}"
# Optional command run by local_resume.sh after the case finished with rc 0 and the y+ check passed.
: "${AFTER_DONE_CMD:=}"
# D-019 (2026-11-12): the laptop does no solver work. 0 = if the handoff fails the case stays stopped (reported in
# STATUS), 1 = old behaviour (resume locally with local_resume.sh).
: "${LOCAL_FALLBACK:=0}"
# Optional VM-side follow-up script uploaded as handoff/<vm>/in/NEXT.sh (sourced by handoff_vm.sh after FINISHED).
: "${NEXT_SH:=}"
